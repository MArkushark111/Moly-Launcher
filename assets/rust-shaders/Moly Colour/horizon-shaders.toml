schema = 1
id = "moly_colour"
name = "Moly Colour"
version = "1.0.0"
api = "0.1"
description = "A restrained Moly colour grade with adjustable contrast, warmth and saturation."
authors = ["Moly"]
license = "MIT"

[[post]]
file = "colour.wgsl"
name = "Moly colour grade"

[[options]]
id = "saturation"
name = "Colour intensity"
type = "float"
default = 1.08
min = 0.5
max = 1.5
step = 0.02

[[options]]
id = "contrast"
name = "Contrast"
type = "float"
default = 1.04
min = 0.8
max = 1.2
step = 0.02

[[options]]
id = "warmth"
name = "Warmth"
type = "float"
default = 0.02
min = -0.1
max = 0.1
step = 0.01

[budget]
gpu_ms = 0.5
